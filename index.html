<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback description for crawlers that don't execute JS. Every route
         overwrites this at runtime via <Seo>; it is deliberately about Icon
         Realty as a whole rather than one project, now that the site covers
         seventeen developments plus the investor, NRI and partner sections. -->
    <meta name="description" content="Icon Realty builds premium plotted developments in Indore: 20+ years, 15+ landmark projects and 4,500+ happy families. Explore our projects, investor and NRI guidance, and channel partner programme." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the CSS actually uses: Outfit 300–700 (was 200–900,
         i.e. 4 unused faces), Cinzel 500/600, Caveat 600, Special Elite.
         Loaded non-render-blocking (media=print → all on load) so the font
         request never sits on the critical path; display=swap covers the FOUT. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@500;600&family=Outfit:wght@300;400;500;600;700&family=Special+Elite&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@500;600&family=Outfit:wght@300;400;500;600;700&family=Special+Elite&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cinzel:wght@500;600&family=Outfit:wght@300;400;500;600;700&family=Special+Elite&display=swap"
      />
    </noscript>
    <!-- LCP on the home page is the first hero frame; fetch it at highest
         priority alongside the HTML instead of waiting for the JS to ask. -->
    <link rel="preload" as="image" href="/frames/f001.jpg" fetchpriority="high" />
    <title>Icon Realty: Premium plotted developments in Indore</title>
    <script>
      /* Freeze the viewport-height unit (--svh) in px so mobile browsers /
         in-app WebViews hiding their top & bottom bars on scroll can't
         resize every vh-based section mid-scroll (= the layout shift).
         Re-frozen only on rotation or a real window resize. */
      (function () {
        var w = window.innerWidth, h = window.innerHeight;
        var touch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
        var set = function () {
          document.documentElement.style.setProperty('--svh', window.innerHeight / 100 + 'px');
        };
        set();
        window.addEventListener('resize', function () {
          var nw = window.innerWidth, nh = window.innerHeight;
          /* touch devices: height-only changes under 25% of the taller state
             are the browser's own bars (iOS Safari's can be ~27% of the small
             viewport) — rotation changes width, split-screen changes more */
          if (touch && nw === w && Math.abs(nh - h) / Math.max(nh, h) < 0.25) return;
          w = nw; h = nh;
          set();
        });
      })();
    </script>
    <style>
      html, body { background: #F6F2EC; margin: 0; }
      /* Initial loader: paints before React mounts, replaced by app render */
      #initial-loader {
        position: fixed; inset: 0; z-index: 10000;
        background: #F6F2EC;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 22px;
        font-family: 'Outfit', system-ui, -apple-system, sans-serif;
        transform: translateY(0);
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
      }
      /* slides up to reveal the hero once its frame sequence has preloaded */
      #initial-loader.is-leaving { transform: translateY(-100%); }
      #initial-loader img {
        width: 140px; height: auto; display: block;
        animation: ilPulse 1.6s ease-in-out infinite;
      }
      #initial-loader .il-bar {
        width: 180px; height: 2px; background: rgba(20,20,20,0.10);
        border-radius: 2px; overflow: hidden; position: relative;
      }
      #initial-loader .il-bar span {
        position: absolute; inset: 0; background: #F2B68F;
        transform-origin: left;
        animation: ilProgress 1.2s cubic-bezier(0.65, 0, 0.18, 1) infinite;
      }
      #initial-loader .il-label {
        font-size: 10px; letter-spacing: 0.32em; color: #6B6B6B; font-weight: 500;
      }
      @keyframes ilPulse { 0%,100% { opacity: .8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes ilProgress { 0% { transform: translateX(-100%); } 50% { transform: translateX(0); } 100% { transform: translateX(100%); } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <img src="/icon-logo.png" alt="" aria-hidden="true" />
      <div class="il-bar"><span></span></div>
      <span class="il-label">LOADING <span id="initial-loader-percent">0%</span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
